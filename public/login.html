<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - AudioFlow</title>
    <meta name="description" content="Login to AudioFlow - Your Modern Music Streaming Experience">
    <meta name="theme-color" content="#FF3366">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --neon-pink: #ff1177;
            --neon-blue: #00fff2;
            --neon-purple: #bc13fe;
            --neon-yellow: #ffff00;
            --neon-green: #39ff14;
            --neon-orange: #ff6b08;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #000;
            position: relative;
            overflow: hidden;
        }

        /* Neon Background Animation */
        .neon-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            background: 
                linear-gradient(45deg, 
                    rgba(255, 17, 119, 0.1) 0%,
                    rgba(0, 255, 242, 0.1) 33%,
                    rgba(188, 19, 254, 0.1) 66%,
                    rgba(255, 255, 0, 0.1) 100%);
            filter: blur(10px);
            animation: neonFlow 10s linear infinite;
        }

        @keyframes neonFlow {
            0% {
                background-position: 0% 0%;
            }
            100% {
                background-position: 200% 200%;
            }
        }

        /* Neon Lines */
        .neon-lines {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            overflow: hidden;
        }

        .neon-line {
            position: absolute;
            background: linear-gradient(90deg, 
                transparent 0%,
                var(--neon-blue) 50%,
                transparent 100%);
            height: 2px;
            width: 100%;
            opacity: 0;
            animation: neonLineMove 4s linear infinite;
        }

        .neon-line:nth-child(1) {
            top: 20%;
            animation-delay: 0s;
            background: linear-gradient(90deg, 
                transparent 0%,
                var(--neon-pink) 50%,
                transparent 100%);
        }

        .neon-line:nth-child(2) {
            top: 40%;
            animation-delay: 1s;
            background: linear-gradient(90deg, 
                transparent 0%,
                var(--neon-blue) 50%,
                transparent 100%);
        }

        .neon-line:nth-child(3) {
            top: 60%;
            animation-delay: 2s;
            background: linear-gradient(90deg, 
                transparent 0%,
                var(--neon-purple) 50%,
                transparent 100%);
        }

        .neon-line:nth-child(4) {
            top: 80%;
            animation-delay: 3s;
            background: linear-gradient(90deg, 
                transparent 0%,
                var(--neon-green) 50%,
                transparent 100%);
        }

        @keyframes neonLineMove {
            0% {
                transform: translateX(-100%);
                opacity: 0;
            }
            10% {
                opacity: 1;
            }
            90% {
                opacity: 1;
            }
            100% {
                transform: translateX(100%);
                opacity: 0;
            }
        }

        /* Neon Circles */
        .neon-circles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        .neon-circle {
            position: absolute;
            border-radius: 50%;
            opacity: 0.5;
            filter: blur(40px);
            animation: neonPulse 4s ease-in-out infinite;
        }

        .neon-circle:nth-child(1) {
            top: 20%;
            left: 20%;
            width: 200px;
            height: 200px;
            background: var(--neon-pink);
            animation-delay: 0s;
        }

        .neon-circle:nth-child(2) {
            top: 60%;
            left: 60%;
            width: 300px;
            height: 300px;
            background: var(--neon-blue);
            animation-delay: 1s;
        }

        .neon-circle:nth-child(3) {
            top: 40%;
            right: 20%;
            width: 250px;
            height: 250px;
            background: var(--neon-purple);
            animation-delay: 2s;
        }

        .neon-circle:nth-child(4) {
            bottom: 20%;
            left: 40%;
            width: 180px;
            height: 180px;
            background: var(--neon-green);
            animation-delay: 3s;
        }

        @keyframes neonPulse {
            0%, 100% {
                transform: scale(1);
                opacity: 0.5;
            }
            50% {
                transform: scale(1.2);
                opacity: 0.8;
            }
        }

        .login-container {
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(20px);
            border-radius: 20px;
            padding: 40px;
            width: 400px;
            position: relative;
            z-index: 2;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 
                0 0 20px rgba(255, 17, 119, 0.2),
                0 0 40px rgba(0, 255, 242, 0.2),
                inset 0 0 20px rgba(188, 19, 254, 0.2);
            animation: containerGlow 4s ease-in-out infinite;
        }

        @keyframes containerGlow {
            0%, 100% {
                box-shadow: 
                    0 0 20px rgba(255, 17, 119, 0.2),
                    0 0 40px rgba(0, 255, 242, 0.2);
            }
            50% {
                box-shadow: 
                    0 0 30px rgba(188, 19, 254, 0.3),
                    0 0 50px rgba(255, 255, 0, 0.2);
            }
        }

        h1 {
            color: #fff;
            text-align: center;
            margin-bottom: 30px;
            font-size: 2.5em;
            text-shadow: 
                0 0 10px var(--neon-blue),
                0 0 20px var(--neon-blue),
                0 0 30px var(--neon-blue);
            animation: titleGlow 2s ease-in-out infinite alternate;
        }

        @keyframes titleGlow {
            from {
                text-shadow: 
                    0 0 10px var(--neon-blue),
                    0 0 20px var(--neon-blue);
            }
            to {
                text-shadow: 
                    0 0 15px var(--neon-pink),
                    0 0 25px var(--neon-pink),
                    0 0 35px var(--neon-pink);
            }
        }

        .input-group {
            position: relative;
            margin-bottom: 30px;
        }

        .input-group input {
            width: 100%;
            padding: 15px 15px 15px 45px;
            border: none;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.05);
            color: white;
            font-size: 16px;
            transition: all 0.3s ease;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .input-group input:focus {
            outline: none;
            border-color: var(--neon-blue);
            box-shadow: 0 0 15px rgba(0, 255, 242, 0.3);
        }

        .input-group i {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--neon-blue);
            font-size: 20px;
            transition: all 0.3s ease;
        }

        .input-group input:focus + i {
            color: var(--neon-pink);
        }

        button {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(45deg, 
                var(--neon-blue),
                var(--neon-purple));
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 2px;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 
                0 5px 20px rgba(0, 255, 242, 0.4),
                0 0 20px rgba(188, 19, 254, 0.4);
        }

        button::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(
                45deg,
                transparent,
                rgba(255, 255, 255, 0.3),
                transparent
            );
            transform: rotate(45deg);
            animation: buttonShine 3s linear infinite;
        }

        @keyframes buttonShine {
            0% { transform: translateX(-100%) rotate(45deg); }
            100% { transform: translateX(100%) rotate(45deg); }
        }

        .links {
            margin-top: 20px;
            text-align: center;
        }

        .links a {
            color: var(--neon-blue);
            text-decoration: none;
            margin: 0 10px;
            font-size: 14px;
            position: relative;
            transition: all 0.3s ease;
        }

        .links a:hover {
            color: var(--neon-pink);
            text-shadow: 0 0 10px var(--neon-pink);
        }

        .error-message {
            color: var(--neon-pink);
            background: rgba(255, 17, 119, 0.1);
            padding: 10px;
            border-radius: 5px;
            margin-bottom: 20px;
            display: none;
            animation: shake 0.5s ease-in-out;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }
    </style>
</head>
<body>
    <div class="neon-bg"></div>
    <div class="neon-lines">
        <div class="neon-line"></div>
        <div class="neon-line"></div>
        <div class="neon-line"></div>
        <div class="neon-line"></div>
    </div>
    <div class="neon-circles">
        <div class="neon-circle"></div>
        <div class="neon-circle"></div>
        <div class="neon-circle"></div>
        <div class="neon-circle"></div>
    </div>
    <div class="login-container">
        <h1>Enter AudioFlow</h1>
        <div class="error-message" id="error-message"></div>
        <form id="login-form">
            <div class="input-group">
                <input type="email" placeholder="Email" required id="email">
                <i class="fas fa-envelope"></i>
            </div>
            <div class="input-group">
                <input type="password" placeholder="Password" required id="password">
                <i class="fas fa-lock"></i>
            </div>
            <button type="submit">Login</button>
        </form>
        <div class="links">
            <a href="signup.html">Create Account</a>
            <a href="#">Forgot Password?</a>
        </div>
    </div>

    <script>
        // Form submission
        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const errorMessage = document.getElementById('error-message');

            try {
                const response = await fetch('/api/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ email, password }),
                });

                const data = await response.json();

                if (data.success) {
                    window.location.href = '/';
                } else {
                    errorMessage.style.display = 'block';
                    errorMessage.textContent = data.message;
                }
            } catch (error) {
                errorMessage.style.display = 'block';
                errorMessage.textContent = 'An error occurred. Please try again.';
            }
        });
    </script>
</body>
</html>
